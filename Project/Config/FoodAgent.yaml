behaviors:
  FoodAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 1024
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        strength: 0.5
        demo_path: Assets/ML-Agents/Examples/EE5108/FoodAgentDemo2_18.demo # replace with your demo file
    behavioral_cloning:
       strength: 0.5
       demo_path: Assets/ML-Agents/Examples/EE5108/FoodAgentDemo2_18.demo  # replace with your demo file
    max_steps: 100000
    time_horizon: 64
    summary_freq: 20000
    
